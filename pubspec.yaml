name: vpnmania
description: Flutter VPN client for Discord access on Android, iOS, and Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  wireguard_flutter:
    path: packages/wireguard_flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/servers.json
